name: 'Update schedule'

on:
  workflow_dispatch:
  schedule:
    - cron: '45 17 * * 4'   # UTC 周四 17:45 = 北京时间周五 01:45
    
permissions:
  contents: write   # 授予内容读写权限

concurrency:
  group: update-schedule-${{ github.repository }}
  cancel-in-progress: false

jobs:
  push:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ 'ubuntu-latest' ]
    steps:
      - name: Set branch name
        id: vars
        run: echo "BRANCH_NAME=${{ github.repository_owner == 'Guovin' && 'gd' || 'master' }}" >> $GITHUB_ENV
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.BRANCH_NAME }}
      - name: Run with setup-python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          update-environment: true
          cache: 'pipenv'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install pipenv
        run: pip3 install --user pipenv
      - name: Install dependencies
        run: pipenv --python 3.14 && pipenv install --deploy
      - name: Update
        run: pipenv run dev
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add --all -- ':!output/data/channel_results.db'
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Github Action Auto Updated"
            git push --force
          fi
